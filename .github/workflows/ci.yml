name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      with_eval:
        description: Run the browser smoke evaluation (downloads Chromium)
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Static checks (typecheck, lint, format, arch, taste, docs, data audit)
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  eval:
    runs-on: ubuntu-latest
    # Browser smoke eval: manual dispatch with with_eval, or explicit re-run.
    if: github.event_name == 'workflow_dispatch' && inputs.with_eval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke evaluation (desktop + mobile)
        run: npm run eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
